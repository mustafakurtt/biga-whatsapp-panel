<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#128c7e">
  <title>WhatsApp Paneli</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section id="login-view" class="login hidden">
    <form id="login-form" class="card">
      <h1>WhatsApp Paneli</h1>
      <label>Kullanıcı adı <input name="username" autocomplete="username" required></label>
      <label>Şifre <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error"></p>
      <button type="submit" class="primary">Giriş yap</button>
    </form>
  </section>

  <section id="main-view" class="main hidden">
    <header class="topbar">
      <strong class="brand">WhatsApp Paneli</strong>
      <span id="me" class="me"></span>
      <span id="live" class="live" title="Canlı bağlantı"></span>
      <button id="push-btn" class="hidden">Bildirimleri aç</button>
      <button id="admin-btn" class="hidden">Yönetim</button>
      <button id="logout-btn">Çıkış</button>
    </header>
    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <h2>Numaralar</h2>
        <ul id="numbers" class="list"></ul>
        <div class="chats-head">
          <h2>Sohbetler</h2>
          <button id="new-chat-btn" class="small hidden">Yeni sohbet</button>
        </div>
        <ul id="chats" class="list"></ul>
      </aside>
      <main id="pane" class="pane">
        <div id="pane-empty" class="empty">Bir sohbet seçin</div>
        <div id="pane-chat" class="hidden">
          <div class="pane-head">
            <button id="back-btn" class="small back">‹ Geri</button>
            <div><strong id="chat-name"></strong><small id="chat-remote"></small></div>
          </div>
          <div id="messages" class="messages"></div>
          <form id="composer" class="composer">
            <textarea name="text" rows="1" placeholder="Mesaj yazın" required></textarea>
            <button type="submit" class="primary">Gönder</button>
          </form>
          <p id="readonly-note" class="note hidden">Salt okunur yetkiniz var, mesaj gönderemezsiniz.</p>
        </div>
      </main>
    </div>
  </section>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
