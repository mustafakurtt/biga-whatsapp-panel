<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f6f4">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Şirketin WhatsApp numaraları için ekip gelen kutusu">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Biga Panel">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Biga Panel">
  <meta name="format-detection" content="telephone=no">
  <title>Biga Panel</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    // İlk boyamadan önce tema (yanıp sönmeyi önler)
    try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <div id="root"><div class="boot" aria-busy="true"><div class="boot-mark"></div></div></div>
  <noscript><p class="noscript">Biga Panel için JavaScript gerekli.</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
